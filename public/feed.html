<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/assets/css/moderation.css"><title>Fil d'actualité — Vistagram</title>
</head>
<body class="mod-page"><main>
    <!-- Page temporaire : le design sera fait par un autre membre de l'équipe -->
    <h1>Fil d'actualité</h1>
    <p><a href="/dashboard.html">← Retour au tableau de bord</a></p>

    <h2>Créer un post</h2>
    <form id="post-form">
        <div>
            <label for="content">Contenu</label><br />
            <textarea id="content" name="content" rows="3" cols="40" required></textarea>
        </div>
        <div>
            <label for="mediaFile">Photo ou vidéo (optionnel)</label><br />
            <input type="file" id="mediaFile" name="mediaFile" accept="image/*,video/*" />
        </div>
        <div>
            <label for="filter">Filtre (images uniquement)</label><br />
            <select id="filter" name="filter">
                <option value="">Aucun</option>
                <option value="grayscale">Noir et blanc</option>
                <option value="sepia">Sépia</option>
            </select>
        </div>
        <div>
            <label for="visibility">Visibilité</label><br />
            <select id="visibility" name="visibility">
                <option value="public">Public</option>
                <option value="friends">Amis uniquement</option>
            </select>
        </div>
        <button type="submit" id="submit-btn">Publier</button>
    </form>

    <p id="form-message" style="color: red;"></p>

    <h2>Posts</h2>
    <div id="posts">Chargement...</div>

    <script src="/assets/js/common.js"></script>
    <script src="/assets/js/reporting.js"></script>
    <script>
        const form = document.getElementById('post-form');
        const formMessage = document.getElementById('form-message');
        const submitBtn = document.getElementById('submit-btn');
        const postsEl = document.getElementById('posts');

        let viewerId;
        const VIDEO_EXTENSIONS = ['.mp4', '.webm', '.mov', '.mkv'];

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function isVideoUrl(url) {
            return VIDEO_EXTENSIONS.some((ext) => url.toLowerCase().endsWith(ext));
        }

        function renderPost(post) {
            const date = new Date(post.createdAt).toLocaleString('fr-FR');
            const badge = post.visibility === 'FRIENDS' ? '👥 Amis' : '🌍 Public';

            let html = '<article class="mod-card">';
            html += '<a href="/profile.html?id=' + post.author.id + '"><strong>' + escapeHtml(post.author.username) + '</strong></a>';
            html += ' <span>(' + badge + ')</span>';
            html += ' — <small>' + date + '</small>';
            html += '<p>' + escapeHtml(post.content) + '</p>';

            if (post.mediaUrl) {
                if (isVideoUrl(post.mediaUrl)) {
                    html +=
                        '<video src="' + escapeHtml(post.mediaUrl).replaceAll('"', '&quot;') + '" controls style="max-width: 300px; display:block;"></video>';
                } else {
                    html += '<img src="' + escapeHtml(post.mediaUrl).replaceAll('"', '&quot;') + '" alt="media" style="max-width: 300px; display:block;" />';
                }
            }

            html += '<div class="mod-actions"><button data-report-type="POST" data-report-id="' + post.id + '">Signaler la publication</button>';
            html += '<button data-report-type="USER" data-report-id="' + post.author.id + '">Signaler cet utilisateur</button>';
            if (post.author.id === viewerId) html += '<button data-id="' + post.id + '" class="delete-btn">Supprimer</button>';
            html += '</div><details class="mod-comments"><summary data-comments="' + post.id + '">Commentaires</summary><div id="comments-' + post.id + '"></div><form data-comment-form="' + post.id + '"><label>Ajouter un commentaire<textarea name="content" required maxlength="2000" rows="2"></textarea></label><button type="submit">Commenter</button><p role="status"></p></form></details></article>';

            return html;
        }

        async function loadFeed() {
            try {
                if (!viewerId) viewerId = (await Vistagram.api('/api/auth/me')).user.id;
                const response = await fetch('/api/posts', { credentials: 'include' });

                if (response.status === 401) {
                    window.location.href = '/login.html';
                    return;
                }

                const data = await response.json();

                if (!response.ok) {
                    postsEl.textContent = (data.errors || ['Erreur inconnue.']).join(' ');
                    return;
                }

                if (data.posts.length === 0) {
                    postsEl.textContent = 'Aucun post à afficher pour le moment.';
                    return;
                }

                postsEl.innerHTML = data.posts.map(renderPost).join('');

                document.querySelectorAll('.delete-btn').forEach((btn) => {
                    btn.addEventListener('click', async () => {
                        if (!confirm('Supprimer ta publication ?')) return;
                        try {
                            await Vistagram.api('/api/posts/' + btn.dataset.id, { method: 'DELETE' });
                            await loadFeed();
                        } catch (error) { formMessage.textContent = error.message; }
                    });
                });
            } catch (err) {
                postsEl.textContent = 'Impossible de contacter le serveur.';
            }
        }

        // Envoie le fichier au module media (Sharp fait la retouche pour les images ;
        // les vidéos sont enregistrées telles quelles) et renvoie l'URL générée.
        async function uploadMediaFile(file, filter) {
            const formData = new FormData();
            formData.append('file', file);
            if (filter) {
                formData.append('filter', filter);
            }

            const response = await fetch('/api/media/uploads', {
                method: 'POST',
                credentials: 'include',
                body: formData,
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error((data.errors || ["Échec de l'upload du média."]).join(' '));
            }

            return data.mediaUrl;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            formMessage.textContent = '';
            submitBtn.disabled = true;

            try {
                const fileInput = document.getElementById('mediaFile');
                const file = fileInput.files[0];
                let mediaUrl;

                if (file) {
                    formMessage.textContent = 'Envoi du média en cours...';
                    mediaUrl = await uploadMediaFile(file, document.getElementById('filter').value);
                }

                const payload = {
                    content: document.getElementById('content').value,
                    mediaUrl,
                    visibility: document.getElementById('visibility').value,
                };

                const response = await fetch('/api/posts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload),
                });

                const data = await response.json();

                if (!response.ok) {
                    formMessage.textContent = (data.errors || ['Erreur inconnue.']).join(' ');
                    return;
                }

                formMessage.textContent = '';
                form.reset();
                loadFeed();
            } catch (err) {
                formMessage.textContent = err.message || 'Impossible de contacter le serveur.';
            } finally {
                submitBtn.disabled = false;
            }
        });

        postsEl.addEventListener('click', event => {
            const summary = event.target.closest('[data-comments]');
            if (summary) loadComments(summary.dataset.comments);
        });
        async function loadComments(postId) {
            const box = document.getElementById('comments-' + postId);
            try {
                const data = await Vistagram.api('/api/posts/' + postId + '/comments');
                box.replaceChildren();
                if (!data.comments.length) box.textContent = 'Aucun commentaire.';
                for (const comment of data.comments) {
                    const row = document.createElement('div');
                    const text = document.createElement('p');
                    text.textContent = comment.user.username + ' : ' + comment.content;
                    const report = document.createElement('button');
                    report.type = 'button'; report.textContent = 'Signaler le commentaire';
                    report.dataset.reportType = 'COMMENT'; report.dataset.reportId = comment.id;
                    row.append(text, report); box.append(row);
                }
            } catch (error) { box.textContent = error.message; }
        }
        postsEl.addEventListener('submit', async event => {
            const commentForm = event.target.closest('[data-comment-form]');
            if (!commentForm) return;
            event.preventDefault();
            const button = commentForm.querySelector('button');
            if (button.disabled) return;
            button.disabled = true;
            const feedback = commentForm.querySelector('[role="status"]');
            try {
                await Vistagram.api('/api/posts/' + commentForm.dataset.commentForm + '/comments', {
                    method: 'POST', body: JSON.stringify({ content: commentForm.elements.content.value }),
                });
                commentForm.reset(); feedback.textContent = 'Commentaire ajouté.';
                await loadComments(commentForm.dataset.commentForm);
            } catch (error) { feedback.textContent = error.message; }
            finally { button.disabled = false; }
        });
        loadFeed();
    </script>
</main></body>
</html>
