<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/assets/css/moderation.css"><title>Tableau de bord — Vistagram</title>
</head>
<body class="mod-page"><main>
    <!-- Page temporaire : le design sera fait par un autre membre de l'équipe -->
    <h1>Tableau de bord</h1>
    <div id="content">Chargement...</div>
    <p><a href="/feed.html">Voir le fil d'actualité</a></p>
    <p id="moderation-link" hidden><a href="/moderation.html">Modération & signalements</a></p>
    <button id="logout-btn" style="display:none;">Se déconnecter</button>

    <script>
        const contentEl = document.getElementById('content');
        const logoutBtn = document.getElementById('logout-btn');

        async function loadUser() {
            try {
                const response = await fetch('/api/auth/me', { credentials: 'include' });

                if (!response.ok) {
                    window.location.href = '/login.html';
                    return;
                }

                const data = await response.json();
                const user = data.user;

                contentEl.textContent = 'Connecté en tant que ' + user.username + ' (' + user.email + ')';
                document.getElementById('moderation-link').hidden = !['MODERATOR', 'ADMIN', 'SUPER_ADMIN'].includes(user.role);
                logoutBtn.style.display = 'inline-block';
            } catch (err) {
                contentEl.textContent = "Impossible de contacter le serveur.";
            }
        }

        logoutBtn.addEventListener('click', async () => {
            await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
            window.location.href = '/login.html';
        });

        loadUser();
    </script>
</main></body>
</html>
