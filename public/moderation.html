<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modération — Vistagram</title><link rel="stylesheet" href="/assets/css/moderation.css"></head>
<body class="mod-page"><header class="mod-header"><a class="mod-brand" href="/dashboard.html">Vistagram</a><nav><a href="/feed.html">Fil d’actualité</a> · <span id="identity">Vérification de la session…</span></nav></header>
<main><p class="mod-muted">ESPACE ÉQUIPE</p><h1>Modération & signalements</h1><p class="mod-muted">Examiner les signalements, protéger la communauté et suivre chaque décision.</p>
<p id="page-message" role="status" tabindex="-1">Chargement…</p>
<section id="workspace" hidden>
<div class="mod-tabs" aria-label="Vues"><button data-view="reports" aria-selected="true">Signalements</button><button data-view="users" id="users-tab" hidden>Utilisateurs</button><button data-view="logs">Journal des actions</button></div>
<form id="filters" class="mod-toolbar"><div data-filter="reports"><label for="status">Statut</label><select id="status"><option value="pending">En attente</option><option value="resolved">Traités</option><option value="dismissed">Rejetés</option><option value="">Tous</option></select></div><div data-filter="reports"><label for="type">Cible</label><select id="type"><option value="">Toutes les cibles</option><option value="POST">Publications</option><option value="COMMENT">Commentaires</option><option value="USER">Utilisateurs</option></select></div><div data-filter="users" hidden><label for="search-user">Nom d’utilisateur</label><input id="search-user" maxlength="100" placeholder="Rechercher un compte"></div><div data-filter="users" hidden><label for="banned">État du compte</label><select id="banned"><option value="">Tous</option><option value="true">Bannis</option><option value="false">Actifs</option></select></div><button type="submit">Actualiser</button></form>
<p id="result-count" class="mod-muted"></p><div id="results" aria-live="polite"></div>
<div class="mod-pagination"><button id="previous">Précédent</button><span id="page-number"></span><button id="next">Suivant</button></div>
</section></main>
<dialog id="action-dialog" class="mod-dialog"><form id="action-form"><h2 id="action-title">Traiter le signalement</h2><label for="action-choice">Décision</label><select id="action-choice"></select><p id="action-hint"></p><label for="action-reason">Motif de la décision</label><textarea id="action-reason" required minlength="3" maxlength="1000" rows="4"></textarea><p id="action-feedback" role="status"></p><div class="mod-actions"><button type="button" id="action-cancel">Annuler</button><button type="submit" class="primary">Confirmer la décision</button></div></form></dialog>
<script src="/assets/js/common.js"></script><script src="/assets/js/moderation.js"></script></body></html>
